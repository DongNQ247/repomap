<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Map</title>
<style>
:root { --bg: #fafaf8; --fg: #1f2328; --muted: #6b7280; --leaf: #ffffff; --line: #4b6bfb; --border: #c9ccd1;
  --d0: #eef2ff; --d1: #ecfdf5; --d2: #fff7ed; --d3: #fdf2f8; --panel: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181d; --fg: #e6e6e6; --muted: #9aa0a6; --leaf: #23262d; --line: #8ea2ff; --border: #444a55;
    --d0: #1d2238; --d1: #172a24; --d2: #2d2219; --d3: #2c1a25; --panel: #1f2228; }
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
#bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); }
#stats { color: var(--muted); margin-left: auto; }
#main { display: flex; height: calc(100% - 42px); }
#map { display: block; flex: 1; min-width: 0; height: 100%; cursor: grab; }
#side { width: 280px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); }
#side[hidden] { display: none; }
#side-tools { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); }
#tree-search { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
#tree { flex: 1; overflow-y: auto; padding: 4px 0; font: 12px ui-monospace, monospace; }
.row { display: flex; align-items: center; gap: 4px; padding: 1px 8px; white-space: nowrap; }
.row .tw { width: 14px; flex: none; border: 0; background: none; color: var(--muted); padding: 0; cursor: pointer; font: inherit; }
.row .name { cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.row .name:hover { color: var(--line); }
.row.off .name { color: var(--muted); cursor: default; }
.box.focus rect { stroke: var(--line); stroke-width: 3; }
.box text { font: 12px ui-monospace, monospace; fill: var(--fg); pointer-events: none; }
.box rect.leaf { fill: var(--leaf); stroke: var(--border); }
.box.collapsed rect.leaf { stroke-width: 1.5; }
.box.dir, .box.extroot { cursor: pointer; }
.box rect.frame { stroke: var(--muted); stroke-dasharray: 5 3; }
rect.d0 { fill: var(--d0); } rect.d1 { fill: var(--d1); } rect.d2 { fill: var(--d2); } rect.d3 { fill: var(--d3); }
.box.k-test text { fill: var(--muted); }
.arrow .line { fill: none; stroke: var(--line); opacity: .7; }
.arrow .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.arrow:hover .line { opacity: 1; }
.arrow .count { font: 11px system-ui; fill: var(--line); text-anchor: middle; }
#head path { fill: var(--line); }
#panel { position: fixed; right: 16px; bottom: 16px; max-width: min(560px, calc(100% - 32px)); max-height: 45%; overflow: auto;
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: 12px ui-monospace, monospace; }
#panel .head { font-weight: 600; margin-bottom: 4px; }
#panel ul { margin: 6px 0 0; padding-left: 18px; }
#panel .more { color: var(--muted); }
</style>
</head>
<body>
<div id="bar">
  <button id="side-toggle" type="button" aria-controls="side" aria-expanded="true">Tree</button>
  <label><input type="checkbox" id="opt-tests"> Test arrows</label>
  <label><input type="checkbox" id="opt-docs"> Docs/config</label>
  <label><input type="checkbox" id="opt-ext"> External</label>
  <button id="collapse-all" type="button">Collapse all</button>
  <span id="stats"></span>
</div>
<div id="main">
<nav id="side" aria-label="File tree">
  <div id="side-tools"><input id="tree-search" type="search" placeholder="Search files…" aria-label="Search files"><button id="show-all" type="button">Show all</button></div>
  <div id="tree"></div>
</nav>
<svg id="map">
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0L10,5L0,10z"/></marker></defs>
  <g id="viewport"></g>
</svg>
</div>
<div id="panel" hidden></div>
<script id="model" type="application/json">__MODEL__</script>
<script>/*__ELK__*/</script>
<script>/*__AGGREGATE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
